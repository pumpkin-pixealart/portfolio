<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mari B. | Pumpkin Pixelart</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111118;
      color: #f2eee8;
      font-family: Arial, sans-serif;
    }

    header {
      min-height: 70vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 60px 20px;
    }

    h1 {
      font-size: clamp(38px, 7vw, 72px);
      margin: 0 0 12px;
    }

    header p {
      font-size: 20px;
      color: #aaa5b5;
      margin: 0;
    }

    main {
      width: min(1000px, 90%);
      margin: auto;
    }

    section {
      margin-bottom: 100px;
    }

    h2 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .project-description {
      color: #aaa5b5;
      line-height: 1.6;
      max-width: 700px;
    }

    .placeholder {
      border: 1px dashed #55505f;
      padding: 40px;
      text-align: center;
      margin-top: 25px;
      color: #777180;
    }

    footer {
      text-align: center;
      padding: 50px 20px;
      color: #777180;
    }
  </style>
</head>

<body>

  <header>
    <div>
      <h1>Mari B. | Pumpkin Pixelart</h1>
      <p>Pixel Artist & 2D Game Artist</p>
    </div>
  </header>

  <main>

    <section>
      <h2>Ecos da Memória</h2>

      <p class="project-description">
        A 2D narrative game project exploring memories and different
        stages of life through pixel art.
      </p>

      <div class="placeholder">
        Character Art
      </div>

      <div class="placeholder">
        Character Animation
      </div>

      <div class="placeholder">
        Environment Art
      </div>

    </section>

  </main>

  <footer>
    © 2026 Mari B. | Pumpkin Pixelart
  </footer>

</body>
</html>
